<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: enishare:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENiShare</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand"><img src="assets/icon.svg" alt=""><b>ENiShare</b></div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <div class="main">
      <header class="appbar" id="appbar">
        <button class="icon-btn" id="toggle-sidebar" title="Hide sidebar (Ctrl+B)" data-icon="panel-left" data-size="16"></button>
        <div class="title"><b id="view-title">Dashboard</b><small id="view-sub"></small></div>
        <div class="spacer"></div>
        <div id="topbar-actions" class="row"></div>
        <button class="btn primary sm" id="share-toggle"></button>
        <div class="sep"></div>
        <button class="icon-btn" id="theme-btn" title="Theme"></button>
        <button class="icon-btn" id="settings-btn" title="Settings (Ctrl+,)" data-icon="settings" data-size="16"></button>
        <div class="win-ctl">
          <button id="win-min" title="Minimize" aria-label="Minimize" data-icon="minus" data-size="14"></button>
          <button id="win-max" title="Maximize" aria-label="Maximize" data-icon="square" data-size="12"></button>
          <button id="win-close" class="close" title="Close" aria-label="Close" data-icon="x" data-size="14"></button>
        </div>
        <div class="xfer-bar" id="xfer-bar"><i class="out"></i><i class="in"></i></div>
      </header>
      <section class="content" id="content"></section>
      <footer class="statusbar" id="statusbar"></footer>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
